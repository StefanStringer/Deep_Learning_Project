[project]
name = "vla-model"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

# Mirrors your requirements.txt exactly — one package per line
# with the same version constraints you specified
dependencies = [
    # --- Core Deep Learning Frameworks ---
    "torch>=2.3.0,<2.10.0",
    "torchvision>=0.18.0,<0.25.0",

    # --- Numerical Computing & Data Handling ---
    "numpy>=1.26.0,<2.2.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",

    # --- Plotting & Visualisation ---
    "matplotlib>=3.9.0",

    # --- Utilities & Progress Bars ---
    "tqdm>=4.66.0",
]

[tool.uv]
# This project is a research repo, not a publishable library
package = false